name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # `just _check-shell` self-skips when shellcheck is absent so a developer
      # machine without it can still run `just lint`. CI must not inherit that
      # escape hatch: with this set, a missing shellcheck fails the job.
      REQUIRE_SHELLCHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - uses: extractions/setup-just@v2

      - name: Configure Git
        run: |
          git config --global user.name "CI Test"
          git config --global user.email "ci@test.com"
          git config --global init.defaultBranch main

      - run: bun install --frozen-lockfile
      - run: bun run build -- --no-install

      # shellcheck ships preinstalled on the ubuntu-latest runner image, so
      # there is no install step. That is an assumption about someone else's
      # image, not a guarantee — assert it here rather than relying on it
      # silently, so a runner image change fails loudly instead of quietly
      # deleting a lint gate. REQUIRE_SHELLCHECK (job env) is the second layer:
      # it also turns a missing binary into a `just ci` failure.
      - name: Assert shellcheck is available
        run: shellcheck --version

      - run: just ci

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ci
          path: coverage-ci/test-run.log
          if-no-files-found: error

      - name: Package
        run: bun run dist -- --no-install

  test-electron:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.9"
      - uses: extractions/setup-just@v2

      - name: Install xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - run: bun install --frozen-lockfile
      - run: xvfb-run -a just test-electron
